name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.gem }} / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gem: [dommy, dommy-rack, capybara-dommy]
        ruby: ["3.0", "3.1", "3.2", "3.3", "3.4", "4.0"]
        exclude:
          # capybara-dommy requires Ruby >= 3.2.
          - { gem: capybara-dommy, ruby: "3.0" }
          - { gem: capybara-dommy, ruby: "3.1" }

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run ${{ matrix.gem }} tests
        working-directory: gems/${{ matrix.gem }}
        run: bundle exec rake
